<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <form name="login" id="loginForm" action="">
    <fieldset class="form-row">
      <label for="usuario">Usuario:</label>
      <input id="usuario" type="text" required/>
    </fieldset>
    <fieldset class="form-row">
      <label for="contraseña">Contraseña:</label>
      <input id="contraseña" type="password"required/>
    </fieldset>
    <nav>
      <button id="sendForm" type="submit">Aceptar</button>
      <button id="register" type="button">Nuevo usuario</button>
    </nav>
  </form>
  <script src="../js/clases.js" defer></script>
  <script src="../js/index.js" defer></script>
</body>
</html>
